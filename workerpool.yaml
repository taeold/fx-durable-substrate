apiVersion: v1
kind: Namespace
metadata:
  name: ate-demo-fx
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: fx-durable
  namespace: ate-demo-fx
  labels:
    workload: fx-durable
spec:
  replicas: 2
  workerImage: localhost:5001/ateworker-gvisor:latest
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 20m
        memory: 512Mi
