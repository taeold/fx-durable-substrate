metadata:
  atespace: ate-demo-fx
  name: fx-durable-data
workerSelector:
  matchLabels:
    workload: fx-durable
containers:
- name: fx-durable
  image: localhost:5001/fx-durable-actor@sha256:4a941081d1546ce7e8c369b676aafffd55d847ba6bd759f5bc7481c33147c344
  command:
  - node
  - /app/server.ts
  env:
  - name: AI_GATEWAY_API_KEY
    value: ate-placeholder-key
  - name: NODE_EXTRA_CA_CERTS
    value: /run/ate/trust-bundle.pem
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
    timeoutSeconds: 30
  volumeMounts:
  - name: workspace
    mountPath: /workspace
  - name: system-info
    mountPath: /run/ate
resources:
  limits:
  - name: cpu
    quantity: "1"
  - name: memory
    quantity: 512Mi
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_VOLUMES
  # Uses the bundled rustfs bucket on kind; on GKE, set to gs://<your-gcs-bucket>/...
  storageLocation: gs://ate-snapshots/ate-demo-fx-data/
volumes:
- name: workspace
  durableDir: {}
- name: system-info
  systemInfo:
    dataSources:
    - trustBundle:
        names:
        - egress-mitm.ate.dev
        path: trust-bundle.pem
